server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Hash'lenmiş VitePress varlıkları için 1 yıl önbellek
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Temiz URL (cleanUrls) ve 404 yönetimi
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /404.html;
    }
}

