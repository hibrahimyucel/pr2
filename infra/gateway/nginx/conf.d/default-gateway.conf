    # =========================================================================
    # Dinamik Alt Alan Adı (Subdomain) Tespit Tablosu
    # =========================================================================
    map $http_host $subdomain_name {
        "docs.localhost"      "Documentation Project Server (Dökümantasyon)";
        "dashboardq.localhost" "Admin Dashboard Server (Yönetim Paneli)";
        default               "Default Localhost Root Gateway (Ana Dizin)";
    }

    # =========================================================================
    # 1. HTTP -> HTTPS Zorunlu Yönlendirme
    # =========================================================================
    server {
        listen 80;
        server_name localhost *.localhost;
        
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # 2. HTTPS Ana Sunucu (SSL & Yanıt Yönetimi)
    # =========================================================================
    server {
        listen 443 ssl;
        server_name localhost *.localhost;

        # mkcert Yerel Sertifika Yolları
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        
        # SSL Güvenlik Ayarları
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        
        # SSI Desteği (HTML içinde Nginx değişkenlerini göstermek için)
        ssi on;
        
        # Genel Çıktı Türü
        # default_type        text/plain;

        # Alt Klasör Test Bağlantısı (/events)
        location /events {
            default_type "text/plain; charset=utf-8";
            return 200 "🎉 Nginx /events alt klasor testi başarılı.\n\nErişilen Sunucu: $subdomain_name\nKonum: Alt Klasor (/events)\nSSL Baglantısı: Güvenli (OK)\n";
        }
        

        # =========================================================================
        # Gzip Sıkıştırma Ayarları (Metin, JS, CSS, JSON, SVG)
        # =========================================================================
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            image/svg+xml;
        

        # =========================================================================
        # VitePress Statik Dokümantasyon (/docs)
        # =========================================================================
        location = /docs {
            return 301 https://$host/docs/;
        }

        location /docs/ {
            alias /var/www/html/docs/;
            index index.html;

            # Dosya veya klasör bulunamazsa 503 durum koduna düşür (500 döngüsünü önler)
            try_files $uri $uri/ $uri.html =503;
            error_page 503 /docs-pending.html;
        }

        # Sadece Nginx iç yönlendirmesiyle erişilebilen 503 bilgilendirme sayfası
        location = /docs-pending.html {
            root /var/www/html/default-gateway;
            internal;
        }

        # Ana Dizin / Kök Bağlantı (/)
        location / {
            root   /var/www/html/default-gateway;
            index  index.html;
            try_files $uri $uri/ =404;
        }
        }

