server {
    listen 443 ssl;
    server_name dev.localhost;

    # Mevcut mkcert Yerel Sertifikaları
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /docs {
        # Docker dahili DNS üzerinden dinamik çözümleme (Gitea kapalıyken Nginx çökmesini önler)
        set $gitea_upstream http://docs_dev:5174;
        proxy_pass $gitea_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket ve Canlı Arayüz Desteği
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
            location / {
            default_type "text/plain; charset=utf-8";
            return 200 "🎉 Nginx \n\nErişilen Sunucu: $subdomain_name\nKonum: Alt Klasor (/events)\nSSL Baglantısı: Güvenli (OK)\n";
        }
}

