# =========================================================================
# HTTPS Sunucu: docs.localhost -> docs_prod Konteyneri
# =========================================================================
server {
    listen 443 ssl;
    server_name docs.localhost;

    # mkcert Yerel Sertifika Yolları
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Konteyner kapalıyken çökme yerine mevcut 503 UX sayfasını göster
    error_page 502 503 504 /docs-pending.html;

    location = /docs-pending.html {
        root /var/www/html/default-gateway;
        internal;
    }

    location / {
        # Docker iç DNS çözümlemesi (Konteyner yeniden başlasa bile IP değişimini yakalar)
        resolver 127.0.0.11 valid=30s;
        set $upstream_docs http://docs_prod:80;

        proxy_pass $upstream_docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

