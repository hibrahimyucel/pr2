server {
    listen 443 ssl;
    server_name git.localhost;

    # Mevcut mkcert Yerel Sertifikaları
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Büyük Git repository push işlemleri için limit artırımı
    client_max_body_size 512M;

    location / {
        # Docker dahili DNS üzerinden dinamik çözümleme (Gitea kapalıyken Nginx çökmesini önler)
        set $gitea_upstream http://pr2_dev_gitea:3000;
        proxy_pass $gitea_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket ve Canlı Arayüz Desteği
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

